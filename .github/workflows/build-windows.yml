name: Build BiliMusic V0.2.0 for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "BiliMusic_V0.2.0_Source.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract source archive
        shell: pwsh
        run: |
          $archive = "BiliMusic_V0.2.0_Source.zip"
          if (!(Test-Path $archive)) {
            throw "Source archive not found: $archive"
          }

          $sourceRoot = Join-Path $env:RUNNER_TEMP "BiliMusic-V0.2.0-source"
          New-Item -ItemType Directory -Path $sourceRoot -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath $sourceRoot -Force

          $mainFiles = Get-ChildItem -Path $sourceRoot -Filter "main.py" -Recurse -File
          if ($mainFiles.Count -ne 1) {
            throw "Expected exactly one main.py in the source archive; found $($mainFiles.Count)."
          }

          $project = $mainFiles[0].Directory.FullName
          if (!(Test-Path (Join-Path $project "requirements-dev.txt"))) {
            throw "requirements-dev.txt was not found in $project"
          }

          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR\requirements-dev.txt"

      - name: Run tests
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name BiliMusic --collect-all PySide6 main.py

      - name: Package build output
        shell: pwsh
        run: |
          $output = Join-Path $env:GITHUB_WORKSPACE "BiliMusic-V0.2.0-Windows-x64.zip"
          Compress-Archive -Path "$env:PROJECT_DIR\dist\BiliMusic\*" -DestinationPath $output -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-V0.2.0-Windows-x64
          path: BiliMusic-V0.2.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
