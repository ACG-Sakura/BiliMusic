name: Build BiliMusic for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "BiliMusic_V0.1.2_Windows.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Extract source archive
        shell: pwsh
        run: |
          if (!(Test-Path "BiliMusic_V0.1.2_Windows.zip")) {
            throw "Source archive not found. Upload BiliMusic_V0.1.2_Windows.zip to the repository root."
          }
          Expand-Archive -Path "BiliMusic_V0.1.2_Windows.zip" -DestinationPath "$env:RUNNER_TEMP\source" -Force
          $project = Join-Path "$env:RUNNER_TEMP\source" "BiliMusic_V0.1.2"
          if (!(Test-Path (Join-Path $project "main.py"))) {
            throw "main.py was not found in the extracted source archive."
          }
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR\requirements-dev.txt"

      - name: Run tests
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name BiliMusic --collect-all PySide6 main.py

      - name: Package build output
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PROJECT_DIR\dist\BiliMusic\*" -DestinationPath "$env:GITHUB_WORKSPACE\BiliMusic-V0.1.2-Windows-x64.zip" -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-V0.1.2-Windows-x64
          path: BiliMusic-V0.1.2-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
