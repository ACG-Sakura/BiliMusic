name: Build BiliMusic V0.4.34 for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and validate source tree
        shell: pwsh
        run: |
          $candidates = @()
          $candidates += Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter pyproject.toml -File -Recurse -ErrorAction SilentlyContinue
          $projectFile = $candidates | Where-Object {
            $dir = $_.Directory.FullName
            (Test-Path (Join-Path $dir 'main.py')) -and
            (Test-Path (Join-Path $dir 'netease-api/package.json')) -and
            (Test-Path (Join-Path $dir 'netease-api/server.js'))
          } | Select-Object -First 1
          if (!$projectFile) {
            throw 'Could not locate BiliMusic source root (pyproject.toml, main.py and netease-api files).'
          }
          $project = $projectFile.Directory.FullName
          $required = @('requirements.txt','requirements-dev.txt','app/integrations/music/netease_service.py')
          foreach ($file in $required) {
            if (!(Test-Path -LiteralPath (Join-Path $project $file) -PathType Leaf)) {
              throw "Required source file missing: $file"
            }
          }
          "BILIMUSIC_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using project root: $project"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }

      - name: Install local NetEase API runtime
        shell: pwsh
        run: |
          $apiDir = Join-Path $env:BILIMUSIC_PROJECT 'netease-api'
          if (!(Test-Path -LiteralPath (Join-Path $apiDir 'package.json') -PathType Leaf)) {
            throw 'netease-api/package.json not found'
          }
          Push-Location -LiteralPath $apiDir
          try {
            npm install --omit=dev --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed in netease-api' }
          } finally { Pop-Location }
          $moduleManifest = Join-Path $apiDir 'node_modules/@neteasecloudmusicapienhanced/api/package.json'
          if (!(Test-Path -LiteralPath $moduleManifest -PathType Leaf)) {
            throw 'NetEase API npm package was not installed'
          }
          $runtime = Join-Path $apiDir 'runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          Copy-Item -LiteralPath $nodeExe -Destination (Join-Path $runtime 'node.exe') -Force
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'node.exe') -PathType Leaf)) {
            throw 'Bundled node.exe was not created'
          }

      - name: Run automated tests
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed' }

      - name: Compile Python sources
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m compileall -q app tests main.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }

      - name: Build Windows app
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name BiliMusic --collect-all PySide6 `
            --add-data 'netease-api;netease-api' main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Verify bundled NetEase runtime
        shell: pwsh
        run: |
          # PyInstaller 6 places --add-data files under _internal by default.
          # In a frozen one-folder build, sys._MEIPASS points to that directory;
          # NeteaseServiceManager resolves _MEIPASS/netease-api accordingly.
          $bundle = Join-Path $env:BILIMUSIC_PROJECT 'dist/BiliMusic/_internal/netease-api'
          $checks = @(
            (Join-Path $bundle 'server.js'),
            (Join-Path $bundle 'runtime/node.exe'),
            (Join-Path $bundle 'node_modules/@neteasecloudmusicapienhanced/api/package.json')
          )
          foreach ($item in $checks) {
            if (!(Test-Path -LiteralPath $item -PathType Leaf)) {
              throw "Bundled NetEase runtime file missing: $item"
            }
          }

      - name: Stage Windows build artifact
        shell: pwsh
        run: |
          $source = Join-Path $env:BILIMUSIC_PROJECT 'dist/BiliMusic'
          $target = Join-Path $env:GITHUB_WORKSPACE 'artifact/BiliMusic'
          if (!(Test-Path -LiteralPath (Join-Path $source 'BiliMusic.exe') -PathType Leaf)) {
            throw 'BiliMusic.exe was not produced by PyInstaller'
          }
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-V0.4.34-Windows-x64
          path: artifact/BiliMusic/
          if-no-files-found: error
          retention-days: 14
