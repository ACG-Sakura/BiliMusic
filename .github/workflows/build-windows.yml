name: Build BiliMusic V0.4.0 for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "BiliMusic_V0.4.0_Source.zip"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract and validate V0.4.0 source
        shell: pwsh
        run: |
          $archive = "BiliMusic_V0.4.0_Source.zip"
          if (!(Test-Path $archive)) { throw "Source archive not found: $archive" }
          $root = Join-Path $env:RUNNER_TEMP "BiliMusic-V0.4.0-source"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Expand-Archive -Path $archive -DestinationPath $root -Force
          $project = Join-Path $root "BiliMusic_V0.4.0"
          foreach ($required in @("main.py", "requirements-dev.txt", "app\ui\main_window.py", "app\core\playlists.py", "tests\test_playlists.py")) {
            if (!(Test-Path (Join-Path $project $required))) { throw "Required V0.4.0 file missing: $required" }
          }
          $meta = Get-Content (Join-Path $project "pyproject.toml") -Raw
          if ($meta -notmatch '(?m)^version\s*=\s*"0\.4\.0"\s*$') { throw "Project version is not 0.4.0" }
          $ui = Get-Content (Join-Path $project "app\ui\main_window.py") -Raw
          if ($ui -notmatch '歌单管理') { throw "Playlist management UI marker missing" }
          "PROJECT_DIR=$project" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "$env:PROJECT_DIR\requirements-dev.txt"

      - name: Run tests
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name BiliMusic --collect-all PySide6 main.py

      - name: Package build output
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:PROJECT_DIR\dist\BiliMusic\*" -DestinationPath "$env:GITHUB_WORKSPACE\BiliMusic-V0.4.0-Windows-x64.zip" -Force

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-V0.4.0-Windows-x64
          path: BiliMusic-V0.4.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
