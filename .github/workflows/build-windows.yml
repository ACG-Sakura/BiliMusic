name: Build BiliMusic V0.4.402 for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repository stores the project as a versioned source ZIP at its root.
      # It must be extracted before searching for pyproject.toml/main.py.
      - name: Extract and locate V0.4.402 source archive
        shell: pwsh
        run: |
          $archiveName = 'BiliMusic_V0.4.402_Source.zip'
          $archive = Join-Path $env:GITHUB_WORKSPACE $archiveName
          if (!(Test-Path -LiteralPath $archive -PathType Leaf)) {
            $available = Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*Source*.zip' -File | Select-Object -ExpandProperty Name
            throw "Source archive not found: $archiveName. ZIP files found: $($available -join ', ')"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'BiliMusic-V0.4.402-source'
          if (Test-Path -LiteralPath $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $extractRoot -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot -Force

          $projectCandidates = Get-ChildItem -LiteralPath $extractRoot -Filter 'pyproject.toml' -File -Recurse -ErrorAction SilentlyContinue
          $projectFile = $projectCandidates | Where-Object {
            $dir = $_.Directory.FullName
            (Test-Path -LiteralPath (Join-Path $dir 'main.py') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $dir 'requirements.txt') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $dir 'requirements-dev.txt') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $dir 'netease-api/package.json') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $dir 'netease-api/server.js') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $dir 'app/integrations/music/netease_service.py') -PathType Leaf)
          } | Select-Object -First 1

          if (!$projectFile) {
            $listing = Get-ChildItem -LiteralPath $extractRoot -Force -Recurse | Select-Object -First 60 -ExpandProperty FullName
            Write-Host ($listing -join "`n")
            throw 'Extracted ZIP does not contain a valid BiliMusic project root. Expected pyproject.toml, main.py, requirements files, and NetEase API files in one directory.'
          }

          $project = $projectFile.Directory.FullName
          "BILIMUSIC_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using extracted BiliMusic project root: $project"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed' }
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }

      - name: Install local NetEase API runtime
        shell: pwsh
        run: |
          $apiDir = Join-Path $env:BILIMUSIC_PROJECT 'netease-api'
          $packageJson = Join-Path $apiDir 'package.json'
          if (!(Test-Path -LiteralPath $packageJson -PathType Leaf)) {
            throw "netease-api/package.json not found: $packageJson"
          }
          Push-Location -LiteralPath $apiDir
          try {
            npm install --omit=dev --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw 'npm install failed inside netease-api' }
          } finally {
            Pop-Location
          }
          $moduleManifest = Join-Path $apiDir 'node_modules/@neteasecloudmusicapienhanced/api/package.json'
          if (!(Test-Path -LiteralPath $moduleManifest -PathType Leaf)) {
            throw 'NetEase API npm package was not installed'
          }
          $runtime = Join-Path $apiDir 'runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          $nodeExe = (Get-Command node -ErrorAction Stop).Source
          Copy-Item -LiteralPath $nodeExe -Destination (Join-Path $runtime 'node.exe') -Force
          if (!(Test-Path -LiteralPath (Join-Path $runtime 'node.exe') -PathType Leaf)) {
            throw 'Bundled node.exe was not created'
          }

      - name: Run automated tests
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Automated tests failed' }

      - name: Compile Python sources
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m compileall -q app tests main.py
          if ($LASTEXITCODE -ne 0) { throw 'Python compilation failed' }

      - name: Build Windows app
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:BILIMUSIC_PROJECT
          python -m PyInstaller --noconfirm --clean --windowed --onedir `
            --name BiliMusic --collect-all PySide6 --collect-all websockets `
            --add-data 'netease-api;netease-api' `
            --add-data 'app/integrations/obs/web;app/integrations/obs/web' main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Verify bundled NetEase runtime
        shell: pwsh
        run: |
          $dist = Join-Path $env:BILIMUSIC_PROJECT 'dist/BiliMusic'
          $exe = Join-Path $dist 'BiliMusic.exe'
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "PyInstaller did not produce BiliMusic.exe: $exe"
          }

          # PyInstaller 6's default onedir layout places data under _internal.
          # Check both locations to remain compatible if the build config changes.
          $bundleCandidates = @(
            (Join-Path $dist '_internal/netease-api'),
            (Join-Path $dist 'netease-api')
          )
          $bundle = $bundleCandidates | Where-Object {
            (Test-Path -LiteralPath (Join-Path $_ 'server.js') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'runtime/node.exe') -PathType Leaf) -and
            (Test-Path -LiteralPath (Join-Path $_ 'node_modules/@neteasecloudmusicapienhanced/api/package.json') -PathType Leaf)
          } | Select-Object -First 1

          if (!$bundle) {
            Write-Host 'Candidate bundle contents:'
            foreach ($candidate in $bundleCandidates) {
              if (Test-Path -LiteralPath $candidate) {
                Get-ChildItem -LiteralPath $candidate -Force -Recurse | Select-Object -First 80 | ForEach-Object { Write-Host $_.FullName }
              }
            }
            throw 'Bundled NetEase runtime is incomplete: expected server.js, runtime/node.exe and the API package manifest.'
          }
          Write-Host "Verified bundled NetEase runtime: $bundle"

      - name: Stage Windows build artifact
        shell: pwsh
        run: |
          $source = Join-Path $env:BILIMUSIC_PROJECT 'dist/BiliMusic'
          $target = Join-Path $env:GITHUB_WORKSPACE 'artifact/BiliMusic'
          if (!(Test-Path -LiteralPath (Join-Path $source 'BiliMusic.exe') -PathType Leaf)) {
            throw 'BiliMusic.exe is missing; refusing to stage an incomplete build.'
          }
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item -Path (Join-Path $source '*') -Destination $target -Recurse -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-V0.4.402-Windows-x64
          path: artifact/BiliMusic/
          if-no-files-found: error
          retention-days: 14
