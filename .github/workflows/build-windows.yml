name: Build BiliMusic V0.4.3 for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install local NetEase API runtime
        shell: pwsh
        run: |
          npm install --prefix netease-api --omit=dev --no-audit --no-fund
          New-Item -ItemType Directory -Force netease-api/runtime | Out-Null
          Copy-Item (Get-Command node).Source netease-api/runtime/node.exe -Force
      - name: Run automated tests
        run: pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app tests main.py
      - name: Build Windows app
        run: pyinstaller --noconfirm --clean --windowed --onedir --name BiliMusic --collect-all PySide6 --add-data "netease-api;netease-api" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: BiliMusic-V0.4.3-Windows-x64
          path: dist/BiliMusic/
          if-no-files-found: error
          retention-days: 14
